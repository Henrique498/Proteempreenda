name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -sf https://proteempreenda.onrender.com/api/health \
            && echo "Ping OK" \
            || echo "Ping falhou (Render pode estar em cold start)"
