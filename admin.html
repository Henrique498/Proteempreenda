<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/favicon-512x512.png">
	<script>
		(function () {
			const override = sessionStorage.getItem('gn_theme_override');
			const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			const t = (override === 'light' || override === 'dark') ? override : systemTheme;
			if (t === 'light') document.documentElement.classList.add('light-mode');
			localStorage.setItem('theme', t);
		})();
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>GuardianNet Admin</title>
	<link rel="stylesheet" href="guardiannet.css" />
	<style>
		.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
		.card { background: var(--navy-2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
		.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		.row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
		.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
		input, select, textarea { width: 100%; background: var(--navy-3); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; color: var(--white); }
		textarea { min-height: 84px; resize: vertical; }
		button { border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
		.ok { background: linear-gradient(135deg, var(--azul-pastel), var(--verde-pastel)); color: #0a1628; }
		.muted { background: transparent; color: var(--white); border: 1px solid var(--border); }
		.danger { background: rgba(255,59,92,.14); color: #ff8ca0; border: 1px solid rgba(255,59,92,.35); }
		table { width: 100%; border-collapse: collapse; }
		th, td { border-bottom: 1px solid var(--border); padding: 8px; font-size: .9rem; }
		.actions { display: flex; gap: 8px; }
		.actions button[disabled] { opacity: .5; cursor: not-allowed; }
		.msg { min-height: 18px; color: var(--white-dim); margin-top: 8px; }
		.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
		.tab-btn {
			background: transparent;
			color: var(--white-dim);
			border: 1px solid var(--border);
			border-radius: 999px;
			padding: 8px 12px;
			font-weight: 700;
		}
		.tab-btn.active {
			background: linear-gradient(135deg, var(--azul-pastel), var(--verde-pastel));
			color: #0a1628;
			border-color: transparent;
		}
		.tab-panel { display: none; }
		.tab-panel.active { display: block; }
		.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
		.kpi { background: var(--navy-3); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
		.kpi-label { color: var(--white-dim); font-size: .8rem; }
		.kpi-val { font-family: var(--font-head); font-size: 1.3rem; margin-top: 4px; }

		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,.56);
			backdrop-filter: blur(3px);
			display: none;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: 9999;
		}
		.modal-overlay.show { display: flex; }
		.modal-card {
			width: min(680px, 100%);
			background: var(--navy-2);
			border: 1px solid var(--border);
			border-radius: 14px;
			padding: 14px;
			box-shadow: 0 14px 34px rgba(0,0,0,.4);
		}
		.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
		.modal-head h3 { font-family: var(--font-head); font-size: 1.1rem; margin: 0; }
		.modal-close { background: transparent; color: var(--white); border: 1px solid var(--border); width: 34px; height: 34px; border-radius: 9px; }
		.modal-body { display: grid; gap: 10px; }
		.modal-check { display: flex; align-items: center; gap: 8px; color: var(--white-dim); font-size: .9rem; }
		.modal-check input { width: auto; }
		.modal-error { min-height: 18px; color: #ff8ca0; font-size: .86rem; }
		.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

		@media (max-width: 900px) { .row, .row-2, .row-3, .kpis { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<div class="wrap">
		<h1 style="font-family:var(--font-head);margin-bottom:14px">Painel Admin</h1>

		<div class="card">
			<div class="row-3">
				<input id="adminStatus" placeholder="Sessão admin autenticada" disabled />
				<button class="ok" onclick="carregarTudo()">Atualizar dados</button>
				<a href="index.html" style="display:inline-block"><button class="muted" type="button">Voltar ao site</button></a>
			</div>
			<div class="msg" id="msg"></div>
		</div>

		<div class="card">
			<div class="tabs">
				<button type="button" class="tab-btn active" data-tab="usuarios" onclick="trocarAba('usuarios', this)">Usuários</button>
				<button type="button" class="tab-btn" data-tab="planos" onclick="trocarAba('planos', this)">Planos</button>
				<button type="button" class="tab-btn" data-tab="assinaturas" onclick="trocarAba('assinaturas', this)">Assinaturas</button>
			</div>
		</div>

		<div id="tab-planos" class="tab-panel">
			<div class="card">
			<h2 style="font-family:var(--font-head);margin-bottom:10px">Planos</h2>
			<div class="row">
				<input id="pl-nome" placeholder="Nome" />
				<input id="pl-descricao" placeholder="Descrição" />
				<input id="pl-mensal" placeholder="Valor mensal" />
				<input id="pl-anual" placeholder="Valor anual" />
			</div>
			<div style="margin-top:10px"><button class="ok" onclick="criarPlano()">Criar plano</button></div>
			<table style="margin-top:12px">
				<thead><tr><th>ID</th><th>Nome</th><th>Mensal</th><th>Anual</th><th>Ativo</th><th>Ações</th></tr></thead>
				<tbody id="tb-planos"></tbody>
			</table>
			</div>
		</div>

		<div id="tab-usuarios" class="tab-panel active">
			<div class="card">
			<h2 style="font-family:var(--font-head);margin-bottom:10px">Usuários</h2>
			<div class="row">
				<input id="us-nome" placeholder="Nome" />
				<input id="us-email" placeholder="Email" />
				<input id="us-senha" placeholder="Senha (mín. 6)" />
				<input id="us-telefone" placeholder="Telefone" />
				<select id="us-tipo">
					<option value="usuario" selected>usuário</option>
					<option value="admin">admin</option>
				</select>
			</div>
			<div style="margin-top:10px"><button class="ok" onclick="criarUsuario()">Criar usuário</button></div>
			<table style="margin-top:12px">
				<thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Telefone</th><th>Tipo</th><th>Ativo</th><th>Ações</th></tr></thead>
				<tbody id="tb-usuarios"></tbody>
			</table>
			</div>
		</div>

		<div id="tab-assinaturas" class="tab-panel">
			<div class="card">
				<h2 style="font-family:var(--font-head);margin-bottom:10px">Assinaturas</h2>
				<div class="kpis">
					<div class="kpi"><div class="kpi-label">Total</div><div id="as-total" class="kpi-val">0</div></div>
					<div class="kpi"><div class="kpi-label">Ativas</div><div id="as-ativas" class="kpi-val">0</div></div>
					<div class="kpi"><div class="kpi-label">Canceladas</div><div id="as-canceladas" class="kpi-val">0</div></div>
				</div>
				<table style="margin-top:12px">
					<thead>
						<tr>
							<th>ID</th><th>Usuário</th><th>Email</th><th>Plano</th><th>Período</th><th>Status</th><th>Fim</th><th>Ações</th>
						</tr>
					</thead>
					<tbody id="tb-assinaturas"></tbody>
				</table>
			</div>
		</div>
	</div>

	<div id="admin-modal" class="modal-overlay" aria-hidden="true">
		<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
			<div class="modal-head">
				<h3 id="admin-modal-title">Editar</h3>
				<button id="admin-modal-close" type="button" class="modal-close">✕</button>
			</div>
			<div id="admin-modal-body" class="modal-body"></div>
			<div class="modal-actions">
				<button id="admin-modal-cancel" type="button" class="muted">Cancelar</button>
				<button id="admin-modal-confirm" type="button" class="ok">Salvar</button>
			</div>
		</div>
	</div>

	<script>
		const API = 'https://proteempreenda.onrender.com/api';
		const AUTH_API = 'https://proteempreenda.onrender.com/api/auth';
		const SESSION_RUNTIME_KEY = 'gn_runtime_session';
		const msg = document.getElementById('msg');
		const adminStatus = document.getElementById('adminStatus');
		const modal = document.getElementById('admin-modal');
		const modalTitle = document.getElementById('admin-modal-title');
		const modalBody = document.getElementById('admin-modal-body');
		const modalConfirm = document.getElementById('admin-modal-confirm');
		const modalCancel = document.getElementById('admin-modal-cancel');
		const modalClose = document.getElementById('admin-modal-close');

		let modalResolver = null;
		let modalOnConfirm = null;
		function hasRuntimeSession() { return sessionStorage.getItem(SESSION_RUNTIME_KEY) === '1'; }
		function token() { return hasRuntimeSession() ? (localStorage.getItem('gn_token') || '') : ''; }
		function setMsg(t) { msg.textContent = t || ''; }
		function norm(v, fallback = '') { return (v === null || v === undefined) ? fallback : v; }
		function pick(obj, ...keys) {
			for (const k of keys) {
				if (obj && Object.prototype.hasOwnProperty.call(obj, k)) return obj[k];
			}
			return undefined;
		}
		function escAttr(v) {
			return String(norm(v, ''))
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}
		function asBool(v) {
			if (typeof v === 'boolean') return v;
			if (typeof v === 'number') return v === 1;
			const s = String(norm(v, '')).trim().toLowerCase();
			return s === '1' || s === 'true' || s === 'yes' || s === 'on';
		}

		function trocarAba(tab, btn = null) {
			document.querySelectorAll('.tab-panel').forEach((p) => {
				p.classList.toggle('active', p.id === `tab-${tab}`);
			});
			document.querySelectorAll('.tab-btn').forEach((b) => {
				b.classList.toggle('active', b.dataset.tab === tab);
			});
			if (tab === 'assinaturas') {
				carregarAssinaturas().catch((e) => setMsg(e.message));
			}
		}

		function fecharModal(resultado = false) {
			if (!modalResolver) return;
			modal.classList.remove('show');
			modal.setAttribute('aria-hidden', 'true');
			const resolve = modalResolver;
			modalResolver = null;
			modalOnConfirm = null;
			resolve(resultado);
		}

		function abrirModal({ titulo, html, confirmarTexto = 'Salvar', confirmarClasse = 'ok', onConfirm = null }) {
			modalTitle.textContent = titulo || 'Editar';
			modalBody.innerHTML = `${html || ''}<div id="admin-modal-error" class="modal-error"></div>`;
			modalConfirm.textContent = confirmarTexto;
			modalConfirm.className = confirmarClasse;
			modalOnConfirm = onConfirm;
			modal.classList.add('show');
			modal.setAttribute('aria-hidden', 'false');

			return new Promise((resolve) => {
				modalResolver = resolve;
			});
		}

		modalConfirm.addEventListener('click', async () => {
			if (!modalOnConfirm) {
				fecharModal(true);
				return;
			}
			const errEl = document.getElementById('admin-modal-error');
			if (errEl) errEl.textContent = '';
			try {
				await modalOnConfirm();
				fecharModal(true);
			} catch (e) {
				if (errEl) errEl.textContent = e?.message || 'Falha ao salvar.';
			}
		});
		modalCancel.addEventListener('click', () => fecharModal(false));
		modalClose.addEventListener('click', () => fecharModal(false));
		modal.addEventListener('click', (e) => { if (e.target === modal) fecharModal(false); });
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && modal.classList.contains('show')) fecharModal(false);
		});

		async function req(path, method='GET', body=null) {
			if (!token()) throw new Error('Sessão expirada. Faça login novamente.');
			const resp = await fetch(`${API}${path}`, {
				method,
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token()}`
				},
				body: body ? JSON.stringify(body) : undefined
			});
			if (resp.status === 401) {
				localStorage.removeItem('gn_token');
				window.location.href = 'index.html';
				throw new Error('Sessão expirada.');
			}
			if (resp.status === 403) {
				window.location.href = 'app.html';
				throw new Error('Acesso negado.');
			}
			const data = await resp.json().catch(() => ({}));
			if (!resp.ok) throw new Error(data.error || 'Erro na API');
			return data;
		}

		async function validarAcessoAdmin() {
			if (!hasRuntimeSession()) {
				localStorage.removeItem('gn_token');
				localStorage.removeItem('gn_logado');
				localStorage.removeItem('gn_tipo');
				window.location.href = 'index.html#acesso';
				return false;
			}

			if (!token()) {
				window.location.href = 'index.html#acesso';
				return false;
			}

			const resp = await fetch(`${AUTH_API}/me`, {
				headers: { 'Authorization': `Bearer ${token()}` }
			});
			if (!resp.ok) {
				localStorage.removeItem('gn_token');
				localStorage.removeItem('gn_logado');
				localStorage.removeItem('gn_tipo');
				window.location.href = 'index.html';
				return false;
			}

			const perfil = await resp.json();
			const tipo = String(perfil.tipo || 'usuario').toLowerCase();
			localStorage.setItem('gn_tipo', tipo);
			if (tipo !== 'admin') {
				window.location.href = 'app.html';
				return false;
			}

			if (perfil.nome) {
				localStorage.setItem('gn_nome', (perfil.nome || '').split(' ')[0] || 'Admin');
				if (adminStatus) adminStatus.value = `Admin logado: ${perfil.nome}`;
			}
			return true;
		}

		async function carregarPlanos() {
			const planos = await req('/admin/planos');
			const tb = document.getElementById('tb-planos');
			tb.innerHTML = '';
			planos.forEach(p => {
				const ativo = asBool(p.Ativo ?? p.ativo);
				const tr = document.createElement('tr');
				tr.innerHTML = `<td>${p.Id}</td><td>${p.Nome}</td><td>${p.ValorMensal}</td><td>${p.ValorAnual}</td><td>${ativo ? '1' : '0'}</td>
					<td class="actions">
						<button class="muted" onclick="editarPlano(${p.Id}, '${(p.Nome||'').replace(/'/g, "\\'")}', '${(p.Descricao||'').replace(/'/g, "\\'")}', ${p.ValorMensal}, ${p.ValorAnual}, ${ativo ? 'true' : 'false'})">Editar</button>
						<button class="muted" onclick="desativarPlano(${p.Id})" ${ativo ? '' : 'disabled'}>${ativo ? 'Desativar' : 'Inativo'}</button>
					</td>`;
				tb.appendChild(tr);
			});
		}

		async function criarPlano() {
			try {
				const nome = document.getElementById('pl-nome').value.trim();
				const descricao = document.getElementById('pl-descricao').value.trim();
				const mensal = parseValorMonetario(document.getElementById('pl-mensal').value);
				const anual = parseValorMonetario(document.getElementById('pl-anual').value);
				if (nome.length < 3) throw new Error('Informe um nome de plano com pelo menos 3 caracteres.');
				if (!descricao) throw new Error('Informe a descrição do plano.');
				if (mensal === null || anual === null) throw new Error('Valores mensal/anual inválidos. Use números como 29,90.');

				await req('/admin/planos', 'POST', {
					nome,
					descricao,
					valorMensal: mensal,
					valorAnual: anual,
					ativo: true
				});
				document.getElementById('pl-nome').value = '';
				document.getElementById('pl-descricao').value = '';
				document.getElementById('pl-mensal').value = '';
				document.getElementById('pl-anual').value = '';
				await carregarPlanos();
				setMsg('Plano criado.');
			} catch (e) {
				setMsg(e.message || 'Falha ao criar plano.');
			}
		}

		async function editarPlano(id, nome, descricao, mensal, anual, ativoAtual) {
			await abrirModal({
				titulo: `Editar plano #${id}`,
				html: `
					<div class="row-2">
						<input id="md-pl-nome" value="${escAttr(nome)}" placeholder="Nome" />
						<input id="md-pl-descricao" value="${escAttr(descricao)}" placeholder="Descrição" />
						<input id="md-pl-mensal" value="${escAttr(mensal)}" placeholder="Valor mensal" />
						<input id="md-pl-anual" value="${escAttr(anual)}" placeholder="Valor anual" />
					</div>
					<label class="modal-check"><input type="checkbox" id="md-pl-ativo" ${ativoAtual ? 'checked' : ''} /> Plano ativo</label>
				`,
				onConfirm: async () => {
					const n = document.getElementById('md-pl-nome').value.trim();
					const d = document.getElementById('md-pl-descricao').value.trim();
					const m = parseValorMonetario(document.getElementById('md-pl-mensal').value);
					const a = parseValorMonetario(document.getElementById('md-pl-anual').value);
					if (n.length < 3) throw new Error('Informe um nome com pelo menos 3 caracteres.');
					if (!d) throw new Error('Informe a descrição do plano.');
					if (m === null || a === null) throw new Error('Valores mensal/anual inválidos. Use números como 29,90.');
					const ativo = document.getElementById('md-pl-ativo').checked;
					await req(`/admin/planos/${id}`, 'PUT', { nome: n, descricao: d, valorMensal: m, valorAnual: a, ativo });
					await carregarPlanos();
					setMsg('Plano atualizado.');
				}
			});
		}

		function parseValorMonetario(valor) {
			if (valor == null) return null;
			const limpo = String(valor).trim().replace(/\./g, '').replace(',', '.');
			if (!limpo) return null;
			const num = Number(limpo);
			return Number.isFinite(num) ? num : null;
		}

		function somenteDigitos(valor) {
			return String(valor || '').replace(/\D/g, '');
		}

		function formatarTelefone(valor) {
			const d = somenteDigitos(valor).slice(0, 11);
			if (d.length <= 2) return d;
			if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
			if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
			return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
		}

		function formatarMoedaDigitando(valor) {
			const d = somenteDigitos(valor);
			if (!d) return '';
			const centavos = Number(d);
			if (!Number.isFinite(centavos)) return '';
			const valorNum = centavos / 100;
			return valorNum.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
		}

		function validarEmail(email) {
			return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
		}

		function instalarMascarasAdmin() {
			const tel = document.getElementById('us-telefone');
			const plMensal = document.getElementById('pl-mensal');
			const plAnual = document.getElementById('pl-anual');

			if (tel) {
				tel.addEventListener('input', () => {
					tel.value = formatarTelefone(tel.value);
				});
			}

			[plMensal, plAnual].forEach((el) => {
				if (!el) return;
				el.addEventListener('input', () => {
					el.value = formatarMoedaDigitando(el.value);
				});
			});
		}

		async function desativarPlano(id) {
			await abrirModal({
				titulo: 'Desativar plano',
				html: `<p style="color:var(--white-dim)">Tem certeza que deseja desativar o plano <strong>#${id}</strong>?</p>`,
				confirmarTexto: 'Desativar',
				confirmarClasse: 'danger',
				onConfirm: async () => {
					await req(`/admin/planos/${id}`, 'DELETE');
					await carregarPlanos();
					setMsg('Plano desativado.');
				}
			});
		}

		async function carregarUsuarios() {
			const raw = await req('/admin/usuarios');
			const users = Array.isArray(raw)
				? raw
				: (Array.isArray(raw?.usuarios) ? raw.usuarios : (Array.isArray(raw?.data) ? raw.data : []));

			const tb = document.getElementById('tb-usuarios');
			tb.innerHTML = '';

			if (!users.length) {
				tb.innerHTML = '<tr><td colspan="7" style="color:var(--white-dim)">Nenhum usuário encontrado.</td></tr>';
				setMsg('Sem usuários para exibir no momento.');
				return;
			}

			users.forEach(u => {
				const id = Number(pick(u, 'Id', 'id')) || 0;
				const nome = String(norm(pick(u, 'Nome', 'nome'), ''));
				const email = String(norm(pick(u, 'Email', 'email'), ''));
				const telefone = String(norm(pick(u, 'Telefone', 'telefone'), ''));
				const tipo = String(norm(pick(u, 'Tipo', 'tipo'), 'usuario')).toLowerCase();
				const ativo = asBool(pick(u, 'Ativo', 'ativo'));
				const nomeSafe = nome.replace(/'/g, "\\'");

				const tr = document.createElement('tr');
				tr.innerHTML = `<td>${id}</td><td>${escAttr(nome)}</td><td>${escAttr(email)}</td><td>${escAttr(telefone)}</td><td>${escAttr(tipo)}</td><td>${ativo ? '1' : '0'}</td>
					<td class="actions">
						<button class="muted" onclick="editarUsuario(${id}, '${nome.replace(/'/g, "\\'")}', '${telefone.replace(/'/g, "\\'")}', '${tipo.replace(/'/g, "\\'")}', ${ativo ? 'true' : 'false'})">Editar</button>
						<button class="muted" onclick="desativarUsuario(${id})" ${ativo ? '' : 'disabled'}>${ativo ? 'Desativar' : 'Inativo'}</button>
						<button class="danger" onclick="excluirUsuario(${id}, '${nomeSafe}')">Excluir</button>
					</td>`;
				tb.appendChild(tr);
			});
			setMsg('Usuários carregados com sucesso.');
		}

		async function criarUsuario() {
			try {
				const nome = document.getElementById('us-nome').value.trim();
				const email = document.getElementById('us-email').value.trim().toLowerCase();
				const senha = document.getElementById('us-senha').value;
				const telefoneFmt = document.getElementById('us-telefone').value;
				const telefone = somenteDigitos(telefoneFmt);
				const tipo = (document.getElementById('us-tipo').value || 'usuario').trim().toLowerCase();

				if (nome.length < 3) throw new Error('Informe um nome com pelo menos 3 caracteres.');
				if (!validarEmail(email)) throw new Error('Informe um e-mail válido.');
				if ((senha || '').length < 6) throw new Error('A senha deve ter no mínimo 6 caracteres.');
				if (tipo !== 'usuario' && tipo !== 'admin') throw new Error('Tipo inválido. Escolha usuário ou admin.');
				if (telefone && (telefone.length < 10 || telefone.length > 11)) throw new Error('Telefone inválido. Informe DDD + número.');

				await req('/admin/usuarios', 'POST', {
					nome,
					email,
					senha,
					telefone: telefone || null,
					tipo
				});
				document.getElementById('us-nome').value = '';
				document.getElementById('us-email').value = '';
				document.getElementById('us-senha').value = '';
				document.getElementById('us-telefone').value = '';
				document.getElementById('us-tipo').value = 'usuario';
				await carregarUsuarios();
				setMsg('Usuário criado.');
			} catch (e) {
				setMsg(e.message || 'Falha ao criar usuário.');
			}
		}

		async function editarUsuario(id, nome, telefone, tipoAtual, ativo) {
			await abrirModal({
				titulo: `Editar usuário #${id}`,
				html: `
					<div class="row-2">
						<input id="md-us-nome" value="${escAttr(nome)}" placeholder="Nome" />
						<input id="md-us-telefone" value="${escAttr(telefone)}" placeholder="Telefone" />
						<select id="md-us-tipo">
							<option value="usuario" ${(tipoAtual || '').toLowerCase() === 'usuario' ? 'selected' : ''}>usuario</option>
							<option value="admin" ${(tipoAtual || '').toLowerCase() === 'admin' ? 'selected' : ''}>admin</option>
						</select>
					</div>
					<label class="modal-check"><input type="checkbox" id="md-us-ativo" ${ativo ? 'checked' : ''} /> Usuário ativo</label>
				`,
				onConfirm: async () => {
					const n = document.getElementById('md-us-nome').value.trim();
					const t = somenteDigitos(document.getElementById('md-us-telefone').value);
					const tp = document.getElementById('md-us-tipo').value;
					const a = document.getElementById('md-us-ativo').checked;
					if (n.length < 3) throw new Error('Informe um nome com pelo menos 3 caracteres.');
					if (tp !== 'usuario' && tp !== 'admin') throw new Error('Tipo inválido.');
					if (t && (t.length < 10 || t.length > 11)) throw new Error('Telefone inválido. Informe DDD + número.');
					await req(`/admin/usuarios/${id}`, 'PUT', { nome: n, telefone: t || null, tipo: tp, ativo: a });
					await carregarUsuarios();
					setMsg('Usuário atualizado.');
				}
			});

			const mdTel = document.getElementById('md-us-telefone');
			if (mdTel) {
				mdTel.value = formatarTelefone(mdTel.value);
				mdTel.addEventListener('input', () => {
					mdTel.value = formatarTelefone(mdTel.value);
				});
			}
		}

		async function desativarUsuario(id) {
			await abrirModal({
				titulo: 'Desativar usuário',
				html: `<p style="color:var(--white-dim)">Tem certeza que deseja desativar o usuário <strong>#${id}</strong>?</p>`,
				confirmarTexto: 'Desativar',
				confirmarClasse: 'danger',
				onConfirm: async () => {
					await req(`/admin/usuarios/${id}`, 'DELETE');
					await carregarUsuarios();
					setMsg('Usuário desativado.');
				}
			});
		}

		async function excluirUsuario(id, nome) {
			await abrirModal({
				titulo: 'Excluir usuário definitivamente',
				html: `<p style="color:var(--white-dim)">Tem certeza que deseja excluir o usuário <strong>${escAttr(nome || ('#' + id))}</strong>? Esta ação remove também assinaturas, pagamentos, tokens e contatos vinculados.</p>`,
				confirmarTexto: 'Excluir definitivamente',
				confirmarClasse: 'danger',
				onConfirm: async () => {
					await req(`/admin/usuarios/${id}/hard-delete`, 'DELETE');
					await carregarUsuarios();
					await carregarAssinaturas();
					setMsg('Usuário excluído definitivamente do banco de dados.');
				}
			});
		}

		async function carregarAssinaturas() {
			const data = await req('/dashboard');
			const ass = data?.assinaturas || {};
			document.getElementById('as-total').textContent = String(ass.Total || 0);
			document.getElementById('as-ativas').textContent = String(ass.Ativas || 0);
			document.getElementById('as-canceladas').textContent = String(ass.Canceladas || 0);

			const lista = await req('/admin/assinaturas');
			const tb = document.getElementById('tb-assinaturas');
			tb.innerHTML = '';
			if (!Array.isArray(lista) || !lista.length) {
				tb.innerHTML = '<tr><td colspan="8" style="color:var(--white-dim)">Nenhuma assinatura encontrada.</td></tr>';
				setMsg('Resumo de assinaturas carregado.');
				return;
			}

			lista.forEach((a) => {
				const tr = document.createElement('tr');
				const id = Number(a.Id || a.id || 0);
				const usuario = escAttr(a.UsuarioNome || a.usuarioNome || '');
				const email = escAttr(a.UsuarioEmail || a.usuarioEmail || '');
				const plano = escAttr(a.PlanoNome || a.planoNome || '');
				const periodo = escAttr(a.Periodo || a.periodo || 'mensal');
				const status = escAttr(a.Status || a.status || 'ativa');
				const dataFim = escAttr(String(a.DataFim || a.dataFim || '').replace('T', ' ').slice(0, 19));

				tr.innerHTML = `
					<td>${id}</td>
					<td>${usuario}</td>
					<td>${email}</td>
					<td>${plano}</td>
					<td>${periodo}</td>
					<td>${status}</td>
					<td>${dataFim || '-'}</td>
					<td class="actions">
						<button class="muted" onclick="editarAssinatura(${id}, '${periodo.replace(/'/g, "\\'")}', '${status.replace(/'/g, "\\'")}', '${dataFim.replace(/'/g, "\\'")}')">Editar</button>
						<button class="danger" onclick="excluirAssinatura(${id})">Excluir</button>
					</td>
				`;
				tb.appendChild(tr);
			});

			setMsg('Resumo de assinaturas carregado.');
		}

		async function editarAssinatura(id, periodoAtual, statusAtual, dataFimAtual) {
			await abrirModal({
				titulo: `Editar assinatura #${id}`,
				html: `
					<div class="row-2">
						<select id="md-as-periodo">
							<option value="mensal" ${periodoAtual === 'mensal' ? 'selected' : ''}>mensal</option>
							<option value="anual" ${periodoAtual === 'anual' ? 'selected' : ''}>anual</option>
						</select>
						<select id="md-as-status">
							<option value="ativa" ${statusAtual === 'ativa' ? 'selected' : ''}>ativa</option>
							<option value="cancelada" ${statusAtual === 'cancelada' ? 'selected' : ''}>cancelada</option>
							<option value="expirada" ${statusAtual === 'expirada' ? 'selected' : ''}>expirada</option>
							<option value="trialing" ${statusAtual === 'trialing' ? 'selected' : ''}>trialing</option>
						</select>
						<input id="md-as-datafim" placeholder="Data fim (YYYY-MM-DD HH:MM:SS)" value="${escAttr(dataFimAtual || '')}" />
					</div>
				`,
				onConfirm: async () => {
					const periodo = document.getElementById('md-as-periodo').value;
					const status = document.getElementById('md-as-status').value;
					const dataFim = document.getElementById('md-as-datafim').value.trim() || null;
					await req(`/admin/assinaturas/${id}`, 'PUT', { periodo, status, dataFim });
					await carregarAssinaturas();
					setMsg('Assinatura atualizada.');
				}
			});
		}

		async function excluirAssinatura(id) {
			await abrirModal({
				titulo: 'Excluir assinatura',
				html: `<p style="color:var(--white-dim)">Tem certeza que deseja excluir a assinatura <strong>#${id}</strong>? Esta ação remove também pagamentos vinculados.</p>`,
				confirmarTexto: 'Excluir definitivamente',
				confirmarClasse: 'danger',
				onConfirm: async () => {
					await req(`/admin/assinaturas/${id}`, 'DELETE');
					await carregarAssinaturas();
					setMsg('Assinatura excluída do banco de dados com sucesso.');
				}
			});
		}

		async function carregarTudo() {
			try {
				await carregarPlanos();
				await carregarUsuarios();
				await carregarAssinaturas();
				setMsg('Conectado com sucesso.');
			} catch (e) {
				setMsg(e.message);
			}
		}

		document.addEventListener('DOMContentLoaded', async () => {
			instalarMascarasAdmin();
			const ok = await validarAcessoAdmin();
			if (ok) carregarTudo();
		});
	</script>
</body>
</html>
